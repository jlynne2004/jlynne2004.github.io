<style>
  /* =============================================
     Jess Hayden Consulting - Brand Colors
     Primary:  Navy  #1E3A5F
     Accent:   Teal  #1E88A8
  ============================================= */

  /* Content width - use more of the available screen */
  #main,
  .masthead__inner-wrap {
    max-width: 1600px;
  }

  /* Masthead / Navigation */
  .masthead {
    border-bottom: 3px solid #1E88A8;
  }
  .masthead__inner-wrap { padding: 0.5em 1em; }
  .site-title, .site-logo { color: #1E3A5F !important; font-weight: 700 !important; }
  .greedy-nav a { color: #1E3A5F !important; }
  .greedy-nav a:hover { color: #1E88A8 !important; }
  .greedy-nav .visible-links a:before { background: #1E88A8; }
  .greedy-nav__toggle { color: #1E3A5F !important; }
  .greedy-nav .hidden-links { background: #ffffff; border: 1px solid #1E88A8; }
  .greedy-nav .hidden-links a { color: #1E3A5F !important; }
  .greedy-nav .hidden-links a:hover { color: #1E88A8 !important; }

  /* Global links */
  a { color: #1E88A8; }
  a:hover { color: #1E3A5F; }

  /* Headings */
  h1, h2, h3, h4 { color: #1E3A5F; }
  .page__title { color: #1E3A5F; }

  /* Buttons */
  .btn--primary {
    background-color: #1E3A5F !important;
    border-color: #1E3A5F !important;
    color: #fff !important;
  }
  .btn--primary:hover {
    background-color: #1E88A8 !important;
    border-color: #1E88A8 !important;
  }
  .btn--info {
    background-color: #1E88A8 !important;
    border-color: #1E88A8 !important;
    color: #fff !important;
  }
  .btn--info:hover {
    background-color: #1E3A5F !important;
    border-color: #1E3A5F !important;
  }

  /* Footer */
  .page__footer a { color: #1E88A8; }
  .page__footer a:hover { color: #1E3A5F; }

  /* =============================================
     Custom Section Classes
  ============================================= */

  /* Section titles */
  .jh-section-title {
    color: #1E3A5F;
    font-size: 1.8em;
    border-bottom: 3px solid #1E88A8;
    padding-bottom: 0.3em;
    display: inline-block;
    margin-bottom: 1.2em;
  }

  /* Welcome section */
  .jh-welcome {
    background: #f8f9fa;
    border-left: 4px solid #1E88A8;
    padding: 1.5em 2em;
    border-radius: 0 4px 4px 0;
    margin: 2em 0;
  }
  .jh-welcome ul { margin-top: 0.5em; }

  /* Service cards grid */
  .jh-services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 1.5em;
    margin: 1.5em 0 2em;
  }
  .jh-service-card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-top: 4px solid #1E88A8;
    border-radius: 4px;
    padding: 1.5em;
    display: flex;
    flex-direction: column;
  }
  .jh-service-card h3 { color: #1E3A5F; margin-top: 0; font-size: 1.1em; }
  .jh-service-card p { flex-grow: 1; font-size: 0.95em; color: #444; }
  .jh-service-card .jh-price {
    color: #1E88A8;
    font-weight: 600;
    font-size: 0.85em;
    margin: 0.8em 0;
    border-top: 1px solid #e8e8e8;
    padding-top: 0.8em;
  }

  /* Testimonial */
  .jh-testimonial {
    background: #f0f7fb;
    border-left: 4px solid #1E88A8;
    padding: 1.5em 2em;
    margin: 2em 0;
    border-radius: 0 4px 4px 0;
  }
  .jh-testimonial blockquote {
    font-style: italic;
    font-size: 1.05em;
    color: #333;
    margin: 0 0 0.8em 0;
    border: none;
    padding: 0;
  }
  .jh-testimonial cite { color: #1E3A5F; font-weight: 600; font-style: normal; }

  /* Contact form */
  .jh-contact-grid {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 2em;
    margin-top: 1.5em;
  }
  .jh-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1em;
    margin-bottom: 1em;
  }
  .jh-form-field { margin-bottom: 1em; }
  .jh-form-field label {
    display: block;
    margin-bottom: 0.3em;
    font-weight: 600;
    color: #1E3A5F;
    font-size: 0.9em;
  }
  .jh-form-field input,
  .jh-form-field textarea,
  .jh-form-field select {
    width: 100%;
    padding: 0.6em 0.8em;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95em;
    box-sizing: border-box;
    font-family: inherit;
  }
  .jh-form-field input:focus,
  .jh-form-field textarea:focus {
    border-color: #1E88A8;
    outline: none;
    box-shadow: 0 0 0 2px rgba(30,136,168,0.2);
  }
  .jh-btn-submit {
    background: #000000;
    color: #ffffff;
    border: none;
    padding: 0.8em 2em;
    font-size: 1em;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
  }
  .jh-btn-submit:hover { background: #1E3A5F; }

  /* Contact sidebar boxes */
  .jh-contact-box {
    background: #f8f9fa;
    border-radius: 4px;
    padding: 1.5em;
    margin-bottom: 1.5em;
    border-left: 4px solid #1E88A8;
  }
  .jh-contact-box h4 { color: #1E3A5F; margin-top: 0; }

  /* Consultation cards grid */
  .jh-consult-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5em;
    margin: 1.5em 0 2em;
  }
  .jh-consult-card {
    background: #f8f9fa;
    border-top: 4px solid #1E88A8;
    border-radius: 4px;
    padding: 1.5em;
    text-align: center;
  }
  .jh-consult-card h4 { color: #1E3A5F; margin-top: 0; font-size: 1em; }
  .jh-consult-card .jh-price-lg { font-size: 1.6em; font-weight: 700; color: #1E3A5F; }
  .jh-consult-card .jh-duration { color: #666; font-size: 0.85em; margin-bottom: 0.5em; }
  .jh-consult-card p { font-size: 0.9em; color: #444; }
  .jh-consult-card .btn { margin-top: 0.5em; font-size: 0.85em; padding: 0.4em 1em; }

  /* Project STAR format */
  .jh-project {
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 1.5em 2em;
    margin-bottom: 2.5em;
  }
  .jh-project h3 {
    color: #1E3A5F;
    border-bottom: 2px solid #1E88A8;
    padding-bottom: 0.4em;
    margin-top: 0;
  }
  .jh-star-label {
    font-weight: 700;
    color: #1E88A8;
    text-transform: uppercase;
    font-size: 0.75em;
    letter-spacing: 0.1em;
    display: block;
    margin-top: 1em;
  }
  .jh-tools {
    background: #f0f7fb;
    border-radius: 4px;
    padding: 0.6em 1em;
    font-size: 0.9em;
    margin-top: 1em;
  }
  .jh-project-links { margin-top: 1em; }

  /* Skills box */
  .jh-skills-box {
    background: #f0f7fb;
    border-radius: 4px;
    padding: 1.5em;
    margin: 1.5em 0;
  }
  .jh-skills-box h3 { margin-top: 0; }

  /* CTA banner */
  .jh-cta-banner {
    background: #1E3A5F;
    color: #ffffff;
    text-align: center;
    padding: 2.5em 1em;
    border-radius: 4px;
    margin: 2em 0;
  }
  .jh-cta-banner h3 { color: #ffffff; margin-top: 0; }
  .jh-cta-banner p { color: #a0c4d8; margin-bottom: 1.5em; }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .jh-contact-grid { grid-template-columns: 1fr; }
    .jh-form-row { grid-template-columns: 1fr; }
  }
</style>
