<script>
(function () {
  function initAjaxForm(formId, statusId) {
    var form = document.getElementById(formId);
    if (!form) return;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      e.stopPropagation();

      var btn    = form.querySelector('.jh-btn-submit');
      var status = document.getElementById(statusId);

      btn.disabled    = true;
      btn.textContent = 'Sending\u2026';

      fetch('https://formspree.io/f/xnjojryv', {
        method:  'POST',
        body:    new FormData(form),
        headers: { 'Accept': 'application/json' }
      })
      .then(function (res) {
        if (res.ok) {
          form.innerHTML =
            '<p style="color:#1E3A5F;font-weight:600;padding:1em 0;">' +
            'Thanks for reaching out! I\u2019ll be in touch within 24 hours.' +
            '</p>';
        } else {
          btn.disabled    = false;
          btn.textContent = 'Send Message';
          if (status) {
            status.innerHTML =
              '<p style="color:#c0392b;margin-top:0.5em;">' +
              'Something went wrong. Please email me at ' +
              '<a href="mailto:jlynne.hayden@gmail.com">jlynne.hayden@gmail.com</a>' +
              '</p>';
          }
        }
      })
      .catch(function () {
        btn.disabled    = false;
        btn.textContent = 'Send Message';
        if (status) {
          status.innerHTML =
            '<p style="color:#c0392b;margin-top:0.5em;">' +
            'Something went wrong. Please email me at ' +
            '<a href="mailto:jlynne.hayden@gmail.com">jlynne.hayden@gmail.com</a>' +
            '</p>';
        }
      });
    });
  }

  function init() {
    initAjaxForm('home-contact-form',  'home-form-status');
    initAjaxForm('contact-page-form',  'contact-form-status');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>
