# Site Settings
title: "Jess Hayden Consulting"
subtitle: "Healthcare Data Solutions"
description: "Healthcare data consultant specializing in HIPAA compliance, data quality, and analytics automation. Serving clients nationwide from Marlton, NJ."
url: "https://jesshaydenconsulting.com"
baseurl: ""

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"

# SEO
og_image: "/assets/jessica-profile.jpg"

# Author
author:
  name: "Jess Hayden"
  bio: "Healthcare data specialist | SQL · Python · Power BI | HIPAA compliance | Proactive problem-solver"
  location: "Marlton, NJ area"
  email: "jlynne.hayden@gmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jlynne.hayden@gmail.com?subject=Consulting Inquiry"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/jessica-hayden-85"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jlynne2004"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# Build settings
include:
  - _pages

# Reading Files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - Website_Content_for_Claude_Code.md
