<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" width="1600" height="700">

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="80" height="70" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 70" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <!-- Horizontal axis lines -->
  <line x1="260" y1="560" x2="1340" y2="560" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="260" y1="460" x2="1340" y2="460" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="260" y1="360" x2="1340" y2="360" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="260" y1="260" x2="1340" y2="260" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="260" y1="160" x2="1340" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Vertical axis -->
  <line x1="260" y1="140" x2="260" y2="560" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Main area chart fill -->
  <polygon
    points="260,560 380,490 500,510 620,400 740,430 860,310 980,350 1100,270 1220,300 1340,200 1340,560 260,560"
    fill="rgba(30,136,168,0.07)"/>

  <!-- Main line chart -->
  <polyline
    points="260,560 380,490 500,510 620,400 740,430 860,310 980,350 1100,270 1220,300 1340,200"
    fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points on main line -->
  <circle cx="260"  cy="560" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="380"  cy="490" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="500"  cy="510" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="620"  cy="400" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="740"  cy="430" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="860"  cy="310" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="980"  cy="350" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1100" cy="270" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1220" cy="300" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1340" cy="200" r="6" fill="rgba(30,136,168,0.45)"/>

  <!-- Secondary dashed line -->
  <polyline
    points="260,600 380,580 500,590 620,540 740,565 860,510 980,530 1100,490 1220,505 1340,460"
    fill="none" stroke="rgba(30,136,168,0.22)" stroke-width="1.5"
    stroke-dasharray="6,5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bar chart - right panel -->
  <rect x="1380" y="420" width="32" height="140" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="1420" y="350" width="32" height="210" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="1460" y="390" width="32" height="170" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="1500" y="290" width="32" height="270" rx="3" fill="rgba(30,136,168,0.2)"/>
  <rect x="1540" y="330" width="32" height="230" rx="3" fill="rgba(255,255,255,0.09)"/>

  <!-- Small bar chart - left panel -->
  <rect x="60"  y="430" width="28" height="130" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="96"  y="380" width="28" height="180" rx="2" fill="rgba(255,255,255,0.09)"/>
  <rect x="132" y="400" width="28" height="160" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="168" y="330" width="28" height="230" rx="2" fill="rgba(30,136,168,0.16)"/>

  <!-- Donut / gauge chart - upper left -->
  <circle cx="130" cy="200" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
  <circle cx="130" cy="200" r="75" fill="none" stroke="rgba(30,136,168,0.28)" stroke-width="14"
          stroke-dasharray="353" stroke-dashoffset="88"
          stroke-linecap="round" transform="rotate(-90 130 200)"/>
  <circle cx="130" cy="200" r="52" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="8"/>
  <circle cx="130" cy="200" r="52" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"
          stroke-dasharray="245" stroke-dashoffset="70"
          stroke-linecap="round" transform="rotate(-90 130 200)"/>

  <!-- Smaller gauge - upper right area -->
  <circle cx="1480" cy="160" r="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="11"/>
  <circle cx="1480" cy="160" r="55" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="11"
          stroke-dasharray="258" stroke-dashoffset="65"
          stroke-linecap="round" transform="rotate(-90 1480 160)"/>

  <!-- KPI card outlines - top center -->
  <rect x="420" y="55"  width="140" height="65" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <rect x="580" y="55"  width="140" height="65" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <rect x="740" y="55"  width="140" height="65" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <rect x="900" y="55"  width="140" height="65" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- Sparklines inside KPI cards -->
  <polyline points="430,100 450,90 470,95 490,80 510,85 530,72 550,78" fill="none" stroke="rgba(30,136,168,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="590,100 610,108 630,98 650,88 670,92 690,80 710,85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="750,90  770,98  790,85  810,92  830,78  850,84  870,70" fill="none" stroke="rgba(30,136,168,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="910,95  930,88  950,92  970,80  990,86 1010,74 1030,79" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scatter dots - lower region -->
  <circle cx="700" cy="620" r="4" fill="rgba(255,255,255,0.1)"/>
  <circle cx="760" cy="605" r="3" fill="rgba(255,255,255,0.08)"/>
  <circle cx="820" cy="625" r="5" fill="rgba(255,255,255,0.07)"/>
  <circle cx="880" cy="612" r="3" fill="rgba(255,255,255,0.1)"/>
  <circle cx="940" cy="630" r="4" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1000" cy="618" r="3" fill="rgba(255,255,255,0.07)"/>

</svg>
